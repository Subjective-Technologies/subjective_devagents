<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Subjective Chat tray icon">
  <defs>
    <linearGradient id="tile" x1="36" y1="30" x2="220" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.48" stop-color="#48ffb2"/>
      <stop offset="1" stop-color="#5ef2ff"/>
    </linearGradient>
    <linearGradient id="inner" x1="58" y1="48" x2="198" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172335"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowA" markerWidth="9" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,1.4 L4.8,4 L0,6.6 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="18" y="18" width="220" height="220" rx="56" fill="url(#tile)" filter="url(#softShadow)"/>
  <rect x="35" y="35" width="186" height="186" rx="44" fill="url(#inner)"/>

  <g transform="rotate(-16,128,128)" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(105,122) scale(1.22,-1.22) translate(-105,-122)">
      <g transform="rotate(-140,105,122)">
        <path d="M69 122 A36 36 0 1 1 141 122" marker-end="url(#arrowA)"/>
      </g>
    </g>
    <g transform="translate(151,114) scale(1.22,-1.22) translate(-151,-122)">
      <g transform="rotate(40,151,122)">
        <path d="M115 122 A36 36 0 1 1 187 122" marker-end="url(#arrowA)"/>
      </g>
    </g>
  </g>

  <circle cx="128" cy="128" r="13" fill="#ffd166"/>
</svg>
