<svg 
    width="300" 
    height="200" 
    viewBox="0 0 300 200"
    xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <style type="text/css"><![CDATA[
      .robotoMono { font-family: monospace; }
    ]]></style>

    <!-- Neon/glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Triangular arrow tip marker (shortened tip) -->
    <marker 
      id="arrow" 
      markerWidth="8" 
      markerHeight="6" 
      refX="0" 
      refY="3" 
      orient="auto" 
      markerUnits="strokeWidth"
    >
      <path d="M0,1.5 L3,3 L0,4.5 Z" fill="white" />
    </marker>
  </defs>

  <!-- Outer group: rotate both arrows -16° about (150,100) -->
  <g transform="rotate(-16,150,100)">
    <!-- Group for both arrows -->
    <g fill="none" stroke="white" stroke-width="8" filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round">
      <!-- LEFT ARROW -->
      <g transform="translate(130,100) scale(1.3,-1.3) translate(-130,-100)">
        <g transform="translate(0,-3) rotate(-140,130,100)">
          <path d="M101.7,100 A40,40 0 1,1 158.3,100" marker-end="url(#arrow)"/>
        </g>
      </g>
      <!-- RIGHT ARROW -->
      <g transform="translate(165,85) scale(1.3,-1.3) translate(-155,-100)">
        <g transform="translate(0,3) rotate(40,170,100)">
          <path d="M141.7,100 A40,40 0 1,1 198.3,100" marker-end="url(#arrow)"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Centered logo text with Roboto Mono font -->
  <text 
    x="150" 
    y="190" 
    fill="white" 
    font-size="20" 
    text-anchor="middle" 
    class="robotoMono" 
    filter="url(#glow)"
  >
    Subjective Technologies
  </text>
</svg>
