<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; form-action 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self' https://dashboard.subjectivetechnologies.com https://dashboard.worktwins.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock Subjective Chat</title>
    <link rel="stylesheet" href="/login.css">
  </head>
  <body>
    <main class="login-card" aria-labelledby="login-title">
      <header class="auth-brand">
      <svg class="brand-mark" viewBox="0 0 300 200" role="img" aria-label="Subjective Technologies" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,1.5 L3,3 L0,4.5 Z" fill="white"/></marker>
        </defs>
        <g transform="rotate(-16,150,100)">
          <g fill="none" stroke="white" stroke-width="8" filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round">
            <g transform="translate(130,100) scale(1.3,-1.3) translate(-130,-100)"><g transform="translate(0,-3) rotate(-140,130,100)"><path d="M101.7,100 A40,40 0 1,1 158.3,100" marker-end="url(#arrow)"/></g></g>
            <g transform="translate(165,85) scale(1.3,-1.3) translate(-155,-100)"><g transform="translate(0,3) rotate(40,170,100)"><path d="M141.7,100 A40,40 0 1,1 198.3,100" marker-end="url(#arrow)"/></g></g>
          </g>
        </g>
        <text x="150" y="190" fill="white" font-size="20" text-anchor="middle" filter="url(#glow)">Subjective Technologies</text>
      </svg>
      <div>
      <p class="eyebrow">Subjective Chat</p>
      <h1 id="login-title">Welcome back</h1>
      <p class="subtitle">Enter password to access chats on this computer.</p>
      </div>
      </header>
      <div class="error-message" role="alert">Incorrect password. Try again.</div>
      <form method="post" action="/login">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
        <button type="submit">Unlock chat</button>
      </form>
      <p class="local-note">Protected local workspace</p>
    </main>
  </body>
</html>
