<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- Must match index.html: this page drives a pty through the same backend, and a
         cross-origin call is blocked by CSP unless that origin is named here. -->
    <meta name="devagents-api" content="https://devagents-api.subjectivetechnologies.com:8080">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ws: wss: https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://devagents-api.subjectivetechnologies.com:8080; style-src 'self'; script-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none';">
    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" href="/auth.css?v=20260911auth1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continue as…</title>
    <link rel="stylesheet" href="/assets/vendor/xterm.css">
    <link rel="stylesheet" href="/terminal.css">
  </head>
  <body data-page="terminal">
    <section id="ownerAuthPanel" class="owner-auth-panel" aria-labelledby="ownerAuthTitle">
      <div class="owner-auth-card">
        <h1 id="ownerAuthTitle">Sign in to DevAgents</h1>
        <p id="ownerAuthStatus" role="status" aria-live="polite">Checking sign-in…</p>
        <form id="ownerIdentitySignIn">
          <label>User id<input id="ownerUserId" name="user_id" autocomplete="username" required disabled></label>
          <label>Firebase token<input id="ownerFirebaseToken" name="firebase_token" autocomplete="off" spellcheck="false" required disabled></label>
          <label>Company name<input id="ownerCompanyName" name="company_name" autocomplete="organization" required disabled></label>
          <button type="submit" disabled>Continue</button>
        </form>
        <a href="https://dashboard.subjectivetechnologies.com/dashboard/st-backend/my-agents" target="_top">Continue in dashboard</a>
      </div>
    </section>
    <button id="ownerSignOut" class="secondary-button owner-auth-signout" type="button" hidden>Sign out</button>

    <div class="terminal-shell" hidden inert>
      <div class="terminal-status" id="statusLine"></div>
      <div id="term"></div>
    </div>
    <script src="/assets/vendor/xterm.js"></script>
    <script src="/assets/vendor/xterm-addon-fit.js"></script>
    <script src="/firebaseAuth.js?v=20260911auth1"></script>
    <script src="/bootstrap.js?v=20260911auth1"></script>
  </body>
</html>
