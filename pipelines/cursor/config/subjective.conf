# Bundle-local BBConfig file consumed by BBLogger via BBConfig.configure().
# Paths below are placeholders — run.py overrides USERDATA_PATH, LOG_PATH,
# CONTEXT_STORAGE, DATASOURCES_TEMP_STORAGE, and LOG_PREFIX at startup with the
# resolved values (home-userdata wins when present, bundle-local otherwise).
# These keys are honoured by brainboost_data_source_logger_package.BBLogger:
#   - log_enable_files: write per-run dated files (matches subjective platform)
#   - log_file_naming: "per_run" -> one file per process per run
#   - log_file_name_convention: YYYY_MM_DD_HH_MM_SS-[process]-log.log
USERDATA_PATH=
LOG_PATH=
LOG_PREFIX=subjective_chat_codex
LOG_ENABLE_FILES=true
# Terminal output is disabled by default — the per-run log file under LOG_PATH
# is the canonical home. Tail it live with `tail -f $LOG_PATH/*-log.log` when
# you want to watch. Leaving it enabled mixes BBLogger output with run.py's
# JSON reports (--print-env / --check) since BBLogger's writer thread bypasses
# any in-process sys.stdout redirect.
LOG_ENABLE_TERMINAL_OUTPUT=false
LOG_FILE_NAMING=per_run
LOG_FILE_NAME_CONVENTION=YYYY_MM_DD_HH_MM_SS-[process]-log.log
LOG_COLUMNS=timestamp,log_type,process,code_location,message,processing_time
LOG_DELIMITER=|
LOG_DEBUG_MODE=true
CONTEXT_STORAGE=
DATASOURCES_TEMP_STORAGE=
DS_CONNECTION_TMP_SPACE=
