# Pipeline for subjective_devagents.
# Runs on every push to main, on pull requests, and by hand (Actions -> Pipeline -> Run workflow).
# Status of every project's last run: dashboard -> ST Backend -> Pipelines.
name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: [self-hosted, linux]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run check
      - name: Test
        run: npm run test
